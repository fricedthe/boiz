<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ﾄﾞ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { display: flex; height: 100vh; background: #121214; color: #e1e1e6; overflow: hidden; }
        
        /* 画面フィットのレイアウト構成 */
        #left-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; border-right: 2px solid #29292e; background: #1a1a1e; padding: 20px; }
        #right-panel { width: 420px; display: flex; flex-direction: column; background: #121214; height: 100vh; }
        
        /* 左上管理ゾーン */
        #control-zone { position: absolute; top: 20px; left: 20px; display: flex; flex-direction: column; gap: 10px; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px; z-index: 10; border: 1px solid #29292e; width: 220px; }
        .control-item { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 10px; font-size: 0.85rem; }
        
        /* トグルスイッチ */
        .switch { position: relative; display: inline-block; width: 46px; height: 22px; min-width: 46px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #3e3e42; transition: .2s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 4px; bottom: 4px; background-color: white; transition: .2s; border-radius: 50%; }
        input:checked + .slider { background-color: #ffca28; }
        input:checked + .slider:before { transform: translateX(24px); }
        
        /* 入力欄とボタンの共通化 */
        .input-box { width: 100%; padding: 6px 10px; background: #121214; border: 1px solid #29292e; color: #e1e1e6; border-radius: 6px; font-size: 0.8rem; text-align: center; }
        .action-btn { width: 100%; padding: 8px; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: 0.15s; }
        .btn-apply { background: #3e3e42; color: white; }
        .btn-apply:hover { background: #4e4e54; }
        .btn-reverse { background: #e040fb; color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .btn-reverse:hover { background: #e060ff; box-shadow: 0 0 10px rgba(224,64,251,0.4); }
        
        /* メインカウンター表示 */
        #score-display { text-align: center; margin-bottom: 25px; z-index: 5; }
        #coin-count { font-size: 3rem; font-weight: bold; color: #ffca28; text-shadow: 0 4px 12px rgba(255,202,40,0.15); }
        #cps-count { font-size: 1.1rem; color: #a8a8b3; margin-top: 6px; font-weight: 500; }
        #reverse-count-display { font-size: 0.9rem; color: #e040fb; margin-top: 4px; font-weight: bold; }
        
        /* 立体感のある影付きの黄色い丸 */
        #coin-target { 
            width: 240px; 
            height: 240px; 
            background: #ffca28; 
            border-radius: 50%; 
            cursor: pointer; 
            transition: transform 0.05s, box-shadow 0.1s; 
            position: relative; 
            z-index: 5; 
            /* 滑らかな立体感のある影 */
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.45), 
                inset 0 -12px 24px rgba(0,0,0,0.25), 
                inset 0 12px 24px rgba(255,255,255,0.45); 
        }
        #coin-target:active { 
            transform: scale(0.95); 
            box-shadow: 
                0 6px 15px rgba(0, 0, 0, 0.4), 
                inset 0 -6px 12px rgba(0,0,0,0.25), 
                inset 0 6px 12px rgba(255,255,255,0.45); 
        }
        
        /* タブシステム */
        .tab-menu { display: flex; background: #1e1e24; border-bottom: 2px solid #29292e; }
        .tab-btn { flex: 1; padding: 14px; background: none; border: none; color: #a8a8b3; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
        .tab-btn.active { color: #ffca28; background: #121214; border-bottom: 3px solid #ffca28; }
        
        /* パネルコンテンツ（小さめのスクロールUI） */
        .panel-content { flex: 1; overflow-y: auto; padding: 15px; display: none; }
        .panel-content.active { display: block; }
        .section-title { font-size: 0.8rem; color: #ffca28; margin: 15px 0 8px 0; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #29292e; padding-bottom: 4px; }
        
        /* スマートに小さくしたショップアイテム */
        .shop-item { display: flex; align-items: center; background: #1e1e24; padding: 6px 10px; margin-bottom: 6px; border-radius: 6px; border: 1px solid #29292e; cursor: pointer; transition: 0.15s; }
        .shop-item:hover { background: #29292e; border-color: #3e3e42; }
        .shop-item.disabled { opacity: 0.4; cursor: not-allowed; }
        .item-icon { font-size: 1.2rem; margin-right: 10px; }
        .item-info { flex: 1; }
        .item-name { font-size: 0.8rem; font-weight: bold; color: #e1e1e6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
        .item-cost { font-size: 0.7rem; color: #ffca28; margin-top: 1px; }
        .item-count { font-size: 1rem; font-weight: bold; color: #7159c1; margin-left: 10px; }
        
        /* ガチャセクション */
        #gacha-box { background: #1e1e24; border-radius: 8px; padding: 15px; text-align: center; border: 1px solid #29292e; margin-bottom: 15px; }
        .gacha-btn-group { display: flex; gap: 8px; margin-top: 10px; }
        .g-btn { flex: 1; padding: 10px; border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: 0.15s; }
        #gacha-single-btn { background: #7159c1; }
        #gacha-single-btn:hover { background: #8267e3; }
        #gacha-multi-btn { background: #311b92; border: 1px solid #512da8; }
        #gacha-multi-btn:hover { background: #371c9e; box-shadow: 0 0 8px rgba(49,27,146,0.5); }
        #gacha-result-list { margin-top: 12px; max-height: 120px; overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 6px; padding: 5px; font-size: 0.8rem; text-align: left; border: 1px solid #29292e; display: none; }
        .gacha-res-line { padding: 3px 6px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #ffca28; font-weight: 500; }
        
        /* インベントリ格子レイアウト */
        .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 8px; margin-top: 8px; }
        .pet-card { background: #1e1e24; border: 1px solid #29292e; border-radius: 6px; padding: 8px; text-align: center; cursor: pointer; position: relative; transition: 0.15s; }
        .pet-card:hover { border-color: #7159c1; }
        .pet-card.equipped { border-color: #ffca28; background: rgba(255,202,40,0.04); }
        .pet-badge { position: absolute; top: 2px; right: 4px; font-size: 0.6rem; font-weight: bold; color: #ffca28; display: none; }
        .pet-card.equipped .pet-badge { display: block; }
        .pet-card-icon { font-size: 1.6rem; margin-bottom: 4px; }
        .pet-card-name { font-size: 0.7rem; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #e1e1e6; }
        .pet-card-bonus { font-size: 0.6rem; color: #a8a8b3; margin-top: 1px; }
        .pet-card-count { position: absolute; bottom: 2px; right: 4px; font-size: 0.65rem; font-weight: bold; color: #7159c1; background: rgba(0,0,0,0.4); padding: 1px 3px; border-radius: 3px; }
        
        /* 数字浮遊エフェクト */
        .floating-text { position: absolute; font-weight: bold; font-size: 1.3rem; color: #ffca28; pointer-events: none; animation: floatUp 0.7s ease-out forwards; z-index: 100; text-shadow: 0 2px 5px rgba(0,0,0,0.6); }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-90px) scale(0.85); opacity: 0; } }
        
        /* ゴールデンクッキーシステム */
        #buff-display { position: absolute; top: 20px; right: 20px; background: rgba(255,202,40,0.15); border: 1px solid #ffca28; padding: 6px 12px; border-radius: 6px; color: #ffca28; font-weight: bold; font-size: 0.85rem; display: none; z-index: 50; }
        #gcookie { position: absolute; font-size: 3rem; cursor: pointer; z-index: 80; display: none; filter: drop-shadow(0 0 8px #ffca28); user-select: none; }
    </style>
</head>
<body>

    <div id="left-panel">
        <!-- 左上統合管理パネル -->
        <div id="control-zone">
            <div class="control-item">
                <span id="ac-icon">🤖 オート</span>
                <label class="switch">
                    <input type="checkbox" id="autoclicker-toggle">
                    <span class="slider"></span>
                </label>
            </div>
            <div style="border-top: 1px solid #29292e; margin: 2px 0;"></div>
            <div class="control-item" style="flex-direction: column; align-items: flex-start; gap: 4px;">
                <span id="label-code" style="color: #a8a8b3;">🔑 暗号コードを入力:</span>
                <input type="text" id="secret-code-input" class="input-box" placeholder="code...">
                <button class="action-btn btn-apply" onclick="checkSecretCode()">適用</button>
            </div>
            <div style="border-top: 1px solid #29292e; margin: 2px 0;"></div>
            <div class="control-item" style="flex-direction: column; gap: 4px;">
                <button class="action-btn btn-reverse" onclick="triggerReverse()">🌀 リバース (再生)</button>
                <span id="reverse-bonus-hint" style="font-size: 0.65rem; color: #e040fb; text-align: center; width: 100%;">ガチャ運ブースト付与</span>
            </div>
        </div>

        <div id="buff-display">🎰 ブースト: 5x!! (<span id="buff-time">15</span>s)</div>
        <div id="gcookie">🌟</div>

        <div id="score-display">
            <div id="coin-count">0</div>
            <div id="cps-count">毎秒: 0 | クリック: 1</div>
            <div id="reverse-count-display">リバース回数: 0</div>
        </div>

        <div id="coin-target"></div>
    </div>

    <div id="right-panel">
        <div class="tab-menu">
            <button class="tab-btn active" id="tab-shop-btn" onclick="switchTab('shop')">🛒 ショップ</button>
            <button class="tab-btn" id="tab-gacha-btn" onclick="switchTab('gacha')">🥚 ガチャ & ペット</button>
        </div>

        <!-- ショップタブ -->
        <div id="tab-shop" class="panel-content active">
            <div class="section-title" id="title-cpc">🖱️ クリック強化アイテム</div>
            <div id="cpc-list"></div>

            <div class="section-title" id="title-cps">🏢 自動生産プラント施設</div>
            <div id="cps-list"></div>
        </div>

        <!-- ガチャ＆ペットタブ -->
        <div id="tab-gacha" class="panel-content">
            <div id="gacha-box">
                <h3 style="font-size: 0.9rem; font-weight: bold; color: #e1e1e6;" id="title-gacha-head">🎁 拡張ペット召喚コア</h3>
                <p style="font-size: 0.75rem; color: #a8a8b3; margin-top: 2px;" id="gacha-cost-text">単発: 500 | 10連: 5,000 コイン</p>
                <div class="gacha-btn-group">
                    <button id="gacha-single-btn" class="g-btn" onclick="rollGacha(1)">1回引く</button>
                    <button id="gacha-multi-btn" class="g-btn" onclick="rollGacha(10)">🔥 10連ガチャ</button>
                </div>
                <div id="gacha-result-list"></div>
            </div>
            <div class="section-title" id="title-inv">🎒 インベントリ (所持ペット数: 0 / 9種)</div>
            <div class="inventory-grid" id="inventory-container"></div>
        </div>
    </div>

    <script>
        // 固定カオス用絵文字プール
        const poolEmojis = ['🎈','✨','🎉','🎁','🏆','🎰','🎲','🧩','🛒','💎','🪐',' UFO','🛸','🧬','🔮','⚔️','👑','🐺','🦅','🔥','🌌','🐱','🐉','🦁','🐯','🦄','🐼','🦊','🦉','🤖','💫','🎨','⚡','🌟','🍀','🍄','🚀','⚓','🧱','🎈','🔑','📦','🎐','🎐'];
        function getRandomEmoji() { return poolEmojis[Math.floor(Math.random() * poolEmojis.length)]; }

        // ゲームステート
        let game = {
            coins: 0,
            baseCpc: 1,
            reverses: 0,
            equippedPet: null,
            ownedPets: {}, // id: count の形で個数を完全記録
            upgrades: []
        };

        let buffMultiplier = 1;
        let buffTimer = 0;

        // 大ボリュームの130項目超アップグレードリスト
        const baseUpgrades = [];
        // クリック強化（計62個）
        const cNames = ['プラスチックの爪','鉄の指サック','合金のマウス皮膜','レーザーセンサー','サイバネアーム','超電導フィンガー','ソニックポインター','量子クリックドライブ','時空断裂レイザー','ビッグクランチプレッサー','インフィニティガントレット','プラズマトリガー','重力子パルス','反物質タクト','暗黒物質の楔','ワームホールニードル','特異点ブレード','次元歪曲グローブ','クロノスギア','真理のポインティング','タキオンスパーク','虚空の楔','超ひもセパレータ','多元宇宙の指先','概念粉砕コア','因果律崩壊スイッチ','神聖契約のペン','終焉マニフェスト','虚無の支配権','究極特異点「零」'];
        for(let i=0; i<62; i++) {
            let name = cNames[i] || `ハイパークリック粒子 Ver.${i+1}`;
            baseUpgrades.push({
                id: `c${i+1}`,
                name: name,
                cost: 15 * Math.pow(1.65, i),
                type: 'cpc',
                power: Math.max(1, Math.round(1 * Math.pow(1.7, i)))
            });
        }
        // 自動生産施設（計70個）
        const sNames = ['自動カーソル','コイン鋳造ミニ機','コイン農場','巨大採掘鉱山','ゴールドメガ銀行','不滅の神聖鋳造所','魔法の錬金研究所','銀河開拓宇宙船','反物質コンデンサ','タイムマシン','多次元ポータル','ビッグバン生成炉','神の領域のキッチン','ダークマター抽出機','テラフォーミングコア','エイリアンコロニー','ダイソン球発電所','超ひも共鳴炉','マルチバースコレクター','概念事象の地平線','全知の神託所','エントロピー逆転機','エーテル大気プラント','因果律タワー','無限連鎖テッセラクト','絶対存在マトリクス','オメガ星雲コンバイン','虚空の巨神像','多元宇宙ネットワーク','森羅万象ソース','究極概念「一」'];
        for(let i=0; i<70; i++) {
            let name = sNames[i] || `コズミック生産セクター No.${i+1}`;
            baseUpgrades.push({
                id: `s${i+1}`,
                name: name,
                cost: 20 * Math.pow(1.68, i),
                type: 'cps',
                power: 0.2 * Math.pow(1.72, i)
            });
        }

        // カオス絵文字を起動時に完全固定定義
        const staticIcons = {};
        baseUpgrades.forEach(u => { staticIcons[u.id] = getRandomEmoji(); });

        // 全9段階の拡張ペットレア度定義
        const petPool = [
            { id: 'p1', name: 'シャドウファング', rarity: 'Common', bonusType: 'cpc', value: 3, icon: '🐺' },
            { id: 'p2', name: 'エアロウィング', rarity: 'Common', bonusType: 'cps', value: 8, icon: '🦅' },
            { id: 'p3', name: 'パイロコア', rarity: 'Rare', bonusType: 'cpc', value: 20, icon: '🔥' },
            { id: 'p4', name: 'ヴォイドウォーカー', rarity: 'Rare', bonusType: 'cps', value: 65, icon: '🌌' },
            { id: 'p5', name: 'クロノスキャット', rarity: 'Epic', bonusType: 'all', value: 1.4, icon: '🐱' },
            { id: 'p6', name: 'オメガ・ドラグーン', rarity: 'Legendary', bonusType: 'all', value: 2.2, icon: '🐉' },
            { id: 'p7', name: 'コズミック・フェニックス', rarity: 'Mythic', bonusType: 'all', value: 3.5, icon: '☄️' },
            { id: 'p8', name: 'ギャラクシー・リヴァイアサン', rarity: 'Exotic', bonusType: 'all', value: 5.0, icon: '🪐' },
            { id: 'p9', name: 'カオス・マトリクス', rarity: 'Secret', bonusType: 'all', value: 8.5, icon: '🎭' },
            { id: 'p10', name: 'インフィニティ・アイ', rarity: 'Eternal', bonusType: 'all', value: 15.0, icon: '👁️' },
            { id: 'p11', name: 'ファウンダー・クラウン', rarity: 'OG', bonusType: 'all', value: 50.0, icon: '👑' }
        ];
        
        // 残りのUIカオス表示用固定文字
        const uiIcons = { ac: getRandomEmoji(), cpcT: getRandomEmoji(), cpsT: getRandomEmoji(), gachaH: getRandomEmoji(), invT: getRandomEmoji(), shopB: getRandomEmoji(), gachaB: getRandomEmoji() };

        function formatNumber(num) {
            if (num < 1000) return num.toFixed(1).replace('.0', '');
            const suffixes = [
                { v: 1e3, s: 'K' }, { v: 1e6, s: 'M' }, { v: 1e9, s: 'B' }, { v: 1e12, s: 'T' },
                { v: 1e15, s: 'Qa' }, { v: 1e18, s: 'Qi' }, { v: 1e21, s: 'Sx' }, { v: 1e24, s: 'Sp' },
                { v: 1e27, s: 'Oc' }, { v: 1e30, s: 'No' }, { v: 1e33, s: 'Dc' }, { v: 1e36, s: 'Un' },
                { v: 1e39, s: 'Du' }, { v: 1e42, s: 'Tr' }, { v: 1e45, s: 'QaD' }, { v: 1e48, s: 'QiD' }
            ];
            for (let i = suffixes.length - 1; i >= 0; i--) {
                if (num >= suffixes[i].v) {
                    return (num / suffixes[i].v).toFixed(2) + suffixes[i].s;
                }
            }
            return num.toExponential(2);
        }

        function initGame() {
            game.upgrades = baseUpgrades.map(u => ({ ...u, count: 0 }));
            renderShop();
            loadGameOnStart();
            renderInventory();
            updateUI();
        }

        function getCpc() {
            let cpc = game.baseCpc;
            game.upgrades.filter(u => u.type === 'cpc').forEach(u => { cpc += u.power * u.count; });
            if (game.equippedPet) {
                const pet = petPool.find(p => p.id === game.equippedPet);
                if (pet && pet.bonusType === 'cpc') cpc += pet.value;
                if (pet && pet.bonusType === 'all') cpc *= pet.value;
            }
            // リバースボーナス (1回につきクリック10%アップ)
            cpc *= (1 + game.reverses * 0.1);
            return cpc * buffMultiplier;
        }

        function getCps() {
            let cps = 0;
            game.upgrades.filter(u => u.type === 'cps').forEach(u => { cps += u.power * u.count; });
            if (game.equippedPet) {
                const pet = petPool.find(p => p.id === game.equippedPet);
                if (pet && pet.bonusType === 'cps') cps += pet.value;
                if (pet && pet.bonusType === 'all') cps *= pet.value;
            }
            // リバースボーナス (1回につきCPS15%アップ)
            cps *= (1 + game.reverses * 0.15);
            return cps * buffMultiplier;
        }

        function updateUI() {
            document.getElementById('coin-count').innerText = formatNumber(game.coins);
            document.getElementById('cps-count').innerText = `毎秒: ${formatNumber(getCps())} | クリック: ${formatNumber(getCpc())}`;
            document.getElementById('reverse-count-display').innerText = `リバース回数: ${game.reverses}回`;

            // 固定カオスUI装飾
            document.getElementById('ac-icon').innerText = `${uiIcons.ac} オート`;
            document.getElementById('title-cpc').innerText = `${uiIcons.cpcT} クリック強化アイテム`;
            document.getElementById('title-cps').innerText = `${uiIcons.cpsT} 自動生産プラント施設`;
            document.getElementById('title-gacha-head').innerText = `${uiIcons.gachaH} 拡張ペット召喚コア`;
            
            // 所持種類のカウント算出
            let uniqueTypes = Object.keys(game.ownedPets).length;
            document.getElementById('title-inv').innerText = `${uiIcons.invT} インベントリ (所持ペット数: ${uniqueTypes} / ${petPool.length}種)`;
            document.getElementById('tab-shop-btn').innerText = `${uiIcons.shopB} ショップ`;
            document.getElementById('tab-gacha-btn').innerText = `${uiIcons.gachaB} ガチャ & ペット`;

            game.upgrades.forEach(u => {
                const el = document.getElementById(`item-${u.id}`);
                if (el) {
                    if (game.coins >= u.cost) el.classList.remove('disabled');
                    else el.classList.add('disabled');
                    el.querySelector('.item-cost').innerText = `コスト: ${formatNumber(u.cost)} コイン`;
                    el.querySelector('.item-count').innerText = u.count;
                }
            });
        }

        function createFloatingText(text, x, y) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            document.getElementById('left-panel').appendChild(el);
            setTimeout(() => el.remove(), 700);
        }

        function clickCoin(e) {
            const power = getCpc();
            game.coins += power;
            
            let x = window.innerWidth / 4;
            let y = window.innerHeight / 2;
            if (e && e.clientX) {
                x = e.clientX;
                y = e.clientY;
            } else {
                x += (Math.random() - 0.5) * 140;
                y += (Math.random() - 0.5) * 140;
            }
            createFloatingText(`+${formatNumber(power)}`, x, y);
            updateUI();
        }

        document.getElementById('coin-target').addEventListener('click', clickCoin);

        // スペース長押しシステム
        let spaceInterval = null;
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!spaceInterval) {
                    clickCoin();
                    document.getElementById('coin-target').style.transform = 'scale(0.95)';
                    spaceInterval = setInterval(() => {
                        clickCoin();
                        document.getElementById('coin-target').style.transform = document.getElementById('coin-target').style.transform === 'scale(0.95)' ? 'scale(1)' : 'scale(0.95)';
                    }, 50);
                }
            }
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                if (spaceInterval) {
                    clearInterval(spaceInterval);
                    spaceInterval = null;
                    document.getElementById('coin-target').style.transform = 'none';
                }
            }
        });

        // 爆速オートクリッカー (毎秒100回) ＋ 浮遊エフェクト完全対応
        setInterval(() => {
            if (document.getElementById('autoclicker-toggle').checked) {
                clickCoin(null);
            }
        }, 10);

        // CPSタイマー加算
        setInterval(() => {
            const cps = getCps();
            if (cps > 0) {
                game.coins += cps / 10;
                updateUI();
            }
        }, 100);

        // 1秒ごとの完全全自動オートセーブ
        setInterval(() => {
            saveGameStorage();
        }, 1000);

        function buyUpgrade(id) {
            const u = game.upgrades.find(item => item.id === id);
            if (u && game.coins >= u.cost) {
                game.coins -= u.cost;
                u.count++;
                u.cost = Math.ceil(u.cost * 1.15);
                updateUI();
            }
        }

        function renderShop() {
            const cpcList = document.getElementById('cpc-list');
            const cpsList = document.getElementById('cps-list');
            cpcList.innerHTML = '';
            cpsList.innerHTML = '';

            game.upgrades.forEach(u => {
                const item = document.createElement('div');
                item.className = 'shop-item';
                item.id = `item-${u.id}`;
                item.onclick = () => buyUpgrade(u.id);

                item.innerHTML = `
                    <div class="item-icon">${staticIcons[u.id]}</div>
                    <div class="item-info">
                        <div class="item-name">${u.name}</div>
                        <div class="item-cost">コスト: ${formatNumber(u.cost)} コイン</div>
                    </div>
                    <div class="item-count">${u.count}</div>
                `;

                if (u.type === 'cpc') cpcList.appendChild(item);
                else cpsList.appendChild(item);
            });
        }

        function switchTab(tab) {
            document.getElementById('tab-shop-btn').classList.remove('active');
            document.getElementById('tab-gacha-btn').classList.remove('active');
            document.getElementById('tab-shop').classList.remove('active');
            document.getElementById('tab-gacha').classList.remove('active');
            
            if (tab === 'shop') {
                document.getElementById('tab-shop-btn').classList.add('active');
                document.getElementById('tab-shop').classList.add('active');
            } else {
                document.getElementById('tab-gacha-btn').classList.add('active');
                document.getElementById('tab-gacha').classList.add('active');
            }
        }

        // コード入力システム
        function checkSecretCode() {
            const input = document.getElementById('secret-code-input').value.trim();
            if (input === 'cordelius') {
                game.coins += 1e39; // 1 Duodecillion
                alert('🔑 コード成功: 1 Duodecillion コインを獲得しました！');
                updateUI();
            } else {
                alert('❌ 無効な暗号コードです。');
            }
            document.getElementById('secret-code-input').value = '';
        }

        // リバース（再生）機能
        function triggerReverse() {
            if (game.coins >= 1e6) { // 最低1Mコインで実行可能
                if(confirm('🌀 リバース（再生）を行いますか？\n所持金と施設がリセットされますが、リバース回数が+1され、永続ブーストと「ガチャ運」が超大幅アップします！')) {
                    game.reverses++;
                    game.coins = 0;
                    game.upgrades.forEach((u, idx) => {
                        u.count = 0;
                        u.cost = baseUpgrades[idx].cost;
                    });
                    renderShop();
                    updateUI();
                    alert(`🌀 再生が完了しました！現在の転生数: ${game.reverses}回 (ガチャ幸運度が爆増中！)`);
                }
            } else {
                alert('❌ リバースするには最低でも 1.00M (100万) コイン以上が必要です！');
            }
        }

        // 超高確率調整＋リバース連動の9段階レア度ガチャ
        function rollGacha(times) {
            const cost = 500 * times;
            if (game.coins >= cost) {
                game.coins -= cost;
                
                const resultsContainer = document.getElementById('gacha-result-list');
                resultsContainer.innerHTML = '';
                resultsContainer.style.display = 'block';
                
                for(let t=0; t<times; t++) {
                    // 基本確率を大幅にアッパー調整＋リバース回数による幸運度掛け算加算
                    const luckFactor = 1 + game.reverses * 0.5;
                    const rand = Math.random() / luckFactor;
                    
                    let pet;
                    // 超激レアテーブルが出やすい確率設計
                    if (rand > 0.65) pet = petPool[0] || petPool[1]; // Common
                    else if (rand > 0.40) pet = petPool[2] || petPool[3]; // Rare
                    else if (rand > 0.22) pet = petPool[4]; // Epic
                    else if (rand > 0.12) pet = petPool[5]; // Legendary
                    else if (rand > 0.06) pet = petPool[6]; // Mythic
                    else if (rand > 0.03) pet = petPool[7]; // Exotic
                    else if (rand > 0.015) pet = petPool[8]; // Secret
                    else if (rand > 0.005) pet = petPool[9]; // Eternal
                    else pet = petPool[10]; // OG伝説王

                    // 所持個数加算カウント
                    if (!game.ownedPets[pet.id]) {
                        game.ownedPets[pet.id] = 1;
                    } else {
                        game.ownedPets[pet.id]++;
                    }

                    const line = document.createElement('div');
                    line.className = 'gacha-res-line';
                    line.innerText = `✨ [${pet.rarity}] ${pet.name} ${pet.icon}`;
                    resultsContainer.appendChild(line);
                }
                
                renderInventory();
                updateUI();
            } else {
                alert('❌ ガチャを回すためのコインが不足しています！');
            }
        }

        function togglePet(id) {
            if (game.equippedPet === id) {
                game.equippedPet = null;
            } else {
                game.equippedPet = id;
            }
            renderInventory();
            updateUI();
        }

        function renderInventory() {
            const container = document.getElementById('inventory-container');
            container.innerHTML = '';
            
            petPool.forEach(pet => {
                if (game.ownedPets[pet.id] && game.ownedPets[pet.id] > 0) {
                    const card = document.createElement('div');
                    card.className = `pet-card ${game.equippedPet === pet.id ? 'equipped' : ''}`;
                    card.onclick = () => togglePet(pet.id);
                    
                    let desc = pet.bonusType === 'all' ? `x${pet.value}` : `+${pet.value}`;
                    let countLabel = game.ownedPets[pet.id] > 1 ? `<div class="pet-card-count">×${game.ownedPets[pet.id]}</div>` : '';
                    
                    card.innerHTML = `
                        <div class="pet-badge">E</div>
                        <div class="pet-card-icon">${pet.icon}</div>
                        <div class="pet-card-name">${pet.name}</div>
                        <div class="pet-card-bonus">${pet.bonusType.toUpperCase()} ${desc}</div>
                        ${countLabel}
                    `;
                    container.appendChild(card);
                }
            });
        }

        // ゴールデン星クッキー
        function spawnGoldenCookie() {
            const gc = document.getElementById('gcookie');
            gc.style.display = 'block';
            gc.style.left = `${Math.random() * 60 + 20}%`;
            gc.style.top = `${Math.random() * 60 + 20}%`;

            gc.onclick = () => {
                gc.style.display = 'none';
                buffMultiplier = 5;
                buffTimer = 15;
                document.getElementById('buff-display').style.display = 'block';
            };
            setTimeout(() => { gc.style.display = 'none'; }, 8000);
        }
        setInterval(() => { if (Math.random() < 0.25) spawnGoldenCookie(); }, 25000);

        setInterval(() => {
            if (buffTimer > 0) {
                buffTimer--;
                document.getElementById('buff-time').innerText = buffTimer;
                if (buffTimer === 0) {
                    buffMultiplier = 1;
                    document.getElementById('buff-display').style.display = 'none';
                }
            }
        }, 1000);

        // 暗黙ストレージ入出力システム
        function saveGameStorage() {
            localStorage.setItem('cc_auto_save_v3', JSON.stringify({
                coins: game.coins,
                baseCpc: game.baseCpc,
                reverses: game.reverses,
                equippedPet: game.equippedPet,
                ownedPets: game.ownedPets,
                counts: game.upgrades.map(u => ({ id: u.id, count: u.count, cost: u.cost }))
            }));
        }

        function loadGameOnStart() {
            const raw = localStorage.getItem('cc_auto_save_v3');
            if (raw) {
                try {
                    const data = JSON.parse(raw);
                    game.coins = data.coins || 0;
                    game.baseCpc = data.baseCpc || 1;
                    game.reverses = data.reverses || 0;
                    game.equippedPet = data.equippedPet || null;
                    game.ownedPets = data.ownedPets || {};
                    
                    if (data.counts) {
                        data.counts.forEach(saved => {
                            const u = game.upgrades.find(item => item.id === saved.id);
                            if (u) {
                                u.count = saved.count;
                                u.cost = saved.cost;
                            }
                        });
                    }
                    renderShop();
                } catch(e) { console.error("データ破損のためロードをスキップしました", e); }
            }
        }

        initGame();
    </script>
</body>
</html>
