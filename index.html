<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カオス・シャドウ・コインクリッカー</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { display: flex; height: 100vh; background: #121214; color: #e1e1e6; overflow: hidden; }
        #left-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; border-right: 2px solid #29292e; background: #1a1a1e; padding: 20px; }
        #right-panel { width: 420px; display: flex; flex-direction: column; background: #121214; }
        
        /* コントロールゾーン（オートクリッカー、コード、リバース） */
        #control-zone { position: absolute; top: 20px; left: 20px; display: flex; flex-direction: column; gap: 10px; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 8px; z-index: 10; border: 1px solid #29292e; width: 220px; }
        .control-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; }
        .control-label { font-size: 0.85rem; display: flex; align-items: center; gap: 5px; }
        
        .switch { position: relative; display: inline-block; width: 46px; height: 22px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #3e3e42; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #ffca28; }
        input:checked + .slider:before { transform: translateX(24px); }
        
        .code-input-container { display: flex; gap: 5px; width: 100%; margin-top: 5px; }
        .code-input { flex: 1; background: #121214; border: 1px solid #29292e; border-radius: 4px; padding: 4px 8px; color: #e1e1e6; font-size: 0.8rem; }
        .code-btn { background: #3e3e42; border: none; color: white; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .code-btn:hover { background: #4f4f54; }
        
        .reverse-btn { width: 100%; padding: 6px; background: #d43f3f; border: none; color: white; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 0.8rem; transition: 0.2s; margin-top: 5px; }
        .reverse-btn:hover { background: #e64c4c; }
        .reverse-stat { font-size: 0.75rem; color: #a8a8b3; text-align: center; width: 100%; }

        #score-display { text-align: center; margin-bottom: 30px; z-index: 5; }
        #coin-count { font-size: 3rem; font-weight: bold; color: #ffca28; text-shadow: 0 4px 10px rgba(255,202,40,0.2); }
        #cps-count { font-size: 1.2rem; color: #a8a8b3; margin-top: 5px; }
        
        /* 影付きの黄色い丸 */
        #coin-target { width: 240px; height: 240px; background: #ffca28; border-radius: 50%; cursor: pointer; transition: transform 0.05s, box-shadow 0.1s; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 -10px 20px rgba(0,0,0,0.2), inset 0 10px 20px rgba(255,255,255,0.4); position: relative; z-index: 5; }
        #coin-target:active { transform: scale(0.96); box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4), inset 0 -5px 10px rgba(0,0,0,0.2), inset 0 5px 10px rgba(255,255,255,0.4); }
        
        /* 右パネル、タブ、ショップ、ガチャ */
        .tab-menu { display: flex; background: #1e1e24; border-bottom: 2px solid #29292e; }
        .tab-btn { flex: 1; padding: 15px; background: none; border: none; color: #a8a8b3; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.95rem; }
        .tab-btn.active { color: #ffca28; background: #121214; border-bottom: 3px solid #ffca28; }
        .panel-content { flex: 1; overflow-y: auto; padding: 15px; display: none; }
        .panel-content.active { display: block; }
        
        .section-title { font-size: 0.85rem; color: #ffca28; margin: 15px 0 8px 0; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #29292e; padding-bottom: 3px; display: flex; justify-content: space-between; }
        
        /* ちっちゃいショップUI */
        .shop-item { display: flex; align-items: center; background: #1e1e24; padding: 6px 10px; margin-bottom: 6px; border-radius: 50px 6px 6px 50px; border: 1px solid #29292e; cursor: pointer; transition: 0.15s; }
        .shop-item:hover { background: #29292e; border-color: #3e3e42; }
        .shop-item.disabled { opacity: 0.4; cursor: not-allowed; }
        .item-icon { width: 28px; height: 28px; background: #29292e; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; margin-right: 10px; flex-shrink: 0; }
        .item-info { flex: 1; min-width: 0; }
        .item-name { font-size: 0.8rem; font-weight: bold; color: #e1e1e6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .item-cost { font-size: 0.7rem; color: #ffca28; margin-top: 1px; }
        .item-count { font-size: 1rem; font-weight: bold; color: #7159c1; margin-left: 10px; flex-shrink: 0; }
        
        /* ガチャUI */
        #gacha-box { background: #1e1e24; border-radius: 8px; padding: 15px; text-align: center; border: 1px solid #29292e; margin-bottom: 15px; }
        .gacha-btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .g-btn { flex: 1; padding: 10px; border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: 0.2s; }
        #gacha-btn-single { background: #4a90e2; }
        #gacha-btn-single:hover { background: #5ca1f5; }
        #gacha-btn-multi { background: #7159c1; }
        #gacha-btn-multi:hover { background: #8267e3; }
        #gacha-result { margin-top: 12px; font-size: 0.85rem; font-weight: bold; min-height: 40px; color: #ffca28; background: #121214; border-radius: 4px; padding: 8px; text-align: left; overflow-y: auto; max-height: 120px; line-height: 1.4; }
        
        /* インベントリ */
        .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-top: 10px; }
        .pet-card { background: #1e1e24; border: 1px solid #29292e; border-radius: 6px; padding: 8px; text-align: center; cursor: pointer; position: relative; transition: 0.2s; display: flex; flex-direction: column; align-items: center; }
        .pet-card:hover { border-color: #7159c1; }
        .pet-card.equipped { border-color: #ffca28; background: rgba(255,202,40,0.05); box-shadow: 0 0 8px rgba(255,202,40,0.1); }
        .pet-badge { position: absolute; top: 4px; left: 4px; font-size: 0.65rem; font-weight: bold; color: #ffca28; background: rgba(0,0,0,0.4); padding: 1px 4px; border-radius: 3px; display: none; }
        .pet-card.equipped .pet-badge { display: block; }
        .pet-qty { position: absolute; top: 4px; right: 4px; font-size: 0.65rem; font-weight: bold; color: #a8a8b3; background: rgba(0,0,0,0.4); padding: 1px 4px; border-radius: 3px; }
        .pet-card-icon { font-size: 1.6rem; margin: 4px 0; }
        .pet-card-name { font-size: 0.75rem; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%; color: #e1e1e6; }
        .pet-card-rarity { font-size: 0.6rem; font-weight: bold; text-transform: uppercase; margin-top: 2px; }
        .pet-card-bonus { font-size: 0.65rem; color: #a8a8b3; margin-top: 2px; }
        
        /* レア度別テキスト色 */
        .rarity-common { color: #a8a8b3; }
        .rarity-rare { color: #4a90e2; }
        .rarity-epic { color: #ab47bc; }
        .rarity-legendary { color: #ffca28; }
        .rarity-mythic { color: #ec407a; }
        .rarity-exotic { color: #26a69a; }
        .rarity-secret { color: #66bb6a; font-style: italic; }
        .rarity-eternal { color: #26c6da; text-shadow: 0 0 4px rgba(38,198,218,0.4); }
        .rarity-og { color: #ff7043; font-weight: 900; text-shadow: 0 0 6px rgba(255,112,67,0.5); }

        /* エフェクト */
        .floating-text { position: absolute; font-weight: bold; font-size: 1.3rem; color: #ffca28; pointer-events: none; animation: floatUp 0.7s ease-out forwards; z-index: 100; text-shadow: 0 2px 4px rgba(0,0,0,0.6); }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-80px) scale(0.8); opacity: 0; } }
        #buff-display { position: absolute; top: 20px; right: 20px; background: rgba(255,202,40,0.15); border: 1px solid #ffca28; padding: 6px 12px; border-radius: 6px; color: #ffca28; font-weight: bold; display: none; z-index: 50; font-size: 0.85rem; }
        #gcookie { position: absolute; font-size: 3rem; cursor: pointer; z-index: 80; display: none; animation: pulse 1s infinite alternate; filter: drop-shadow(0 0 8px #ffca28); }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.15); } }
    </style>
</head>
<body>

            { id: 'p9', name: 'コズミックフェニックス', rarity: 'Mythic', bonusType: 'all', value: 4.0, rarityClass: 'rarity-mythic' },
            { id: 'p10', name: 'ギャラクシーリヴァイアサン', rarity: 'Exotic', bonusType: 'cpc', value: 500000, rarityClass: 'rarity-exotic' },
            { id: 'p11', name: 'カオスマトリクス', rarity: 'Secret', bonusType: 'all', value: 7.0, rarityClass: 'rarity-secret' },
            { id: 'p12', name: 'インフィニティアイ', rarity: 'Eternal', bonusType: 'all', value: 15.0, rarityClass: 'rarity-eternal' },
            { id: 'p13', name: 'ファウンダー・クラウン', rarity: 'OG', bonusType: 'all', value: 50.0, rarityClass: 'rarity-og' }
        ];

        // 数のフォーマット表示（Duodecillion [Du] を超えて無限まで対応）
        function formatNumber(num) {
            if (num < 1000) return num.toFixed(1).replace('.0', '');
            const suffixes = [
                { v: 1e3, s: 'K' }, { v: 1e6, s: 'M' }, { v: 1e9, s: 'B' }, { v: 1e12, s: 'T' },
                { v: 1e15, s: 'Qa' }, { v: 1e18, s: 'Qi' }, { v: 1e21, s: 'Sx' }, { v: 1e24, s: 'Sp' },
                { v: 1e27, s: 'Oc' }, { v: 1e30, s: 'No' }, { v: 1e33, s: 'Dc' }, { v: 1e36, s: 'Un' },
                { v: 1e39, s: 'Du' }, { v: 1e42, s: 'Tr' }, { v: 1e45, s: 'QaD' }, { v: 1e48, s: 'QiD' },
                { v: 1e51, s: 'SxD' }, { v: 1e54, s: 'SpD' }, { v: 1e57, s: 'OcD' }, { v: 1e60, s: 'NoD' },
                { v: 1e63, s: 'Vg' }, { v: 1e66, s: 'UnV' }, { v: 1e69, s: 'DuV' }, { v: 1e72, s: 'TrV' }
            ];
            for (let i = suffixes.length - 1; i >= 0; i--) {
                if (num >= suffixes[i].v) {
                    return (num / suffixes[i].v).toFixed(2) + suffixes[i].s;
                }
            }
            return num.toExponential(2);
        }

        // 初期化処理
        function initGame() {
            // 固定用ランダム絵文字の割り振りを1度だけ行う
            uiEmojis['ac'] = getRandomEmoji();
            uiEmojis['cpc'] = getRandomEmoji();
            uiEmojis['cps'] = getRandomEmoji();
            uiEmojis['gacha'] = getRandomEmoji();
            uiEmojis['inv'] = getRandomEmoji();
            uiEmojis['g_cookie'] = getRandomEmoji();

            rawUpgrades.forEach(u => { uiEmojis[u.id] = getRandomEmoji(); });
            petPool.forEach(p => { uiEmojis[p.id] = getRandomEmoji(); });

            game.upgrades = rawUpgrades.map(u => ({ ...u, count: 0 }));
            
            // ローカルストレージからのロード試行（全自動セーブデータがある場合）
            loadGameOnLaunch();
            
            renderShop();
            renderInventory();
            updateUI();
        }

        function getCpc() {
            let cpc = game.baseCpc;
            game.upgrades.filter(u => u.type === 'cpc').forEach(u => {
                cpc += u.power * u.count;
            });
            if (game.equippedPet) {
                const pet = petPool.find(p => p.id === game.equippedPet);
                if (pet && pet.bonusType === 'cpc') cpc += pet.value;
                if (pet && pet.bonusType === 'all') cpc *= pet.value;
            }
            return cpc * buffMultiplier;
        }

        function getCps() {
            let cps = 0;
            game.upgrades.filter(u => u.type === 'cps').forEach(u => {
                cps += u.power * u.count;
            });
            if (game.equippedPet) {
                const pet = petPool.find(p => p.id === game.equippedPet);
                if (pet && pet.bonusType === 'cps') cps += pet.value;
                if (pet && pet.bonusType === 'all') cps *= pet.value;
            }
            return cps * buffMultiplier;
        }

        function updateUI() {
            document.getElementById('coin-count').innerText = formatNumber(game.coins);
            const currentCps = getCps();
            const currentCpc = getCpc();
            document.getElementById('cps-count').innerText = `毎秒: ${formatNumber(currentCps)} | クリック: ${formatNumber(currentCpc)}`;

            // UI見出しパーツ（起動時に固定された絵文字を使用）
            document.getElementById('label-ac').innerText = `${uiEmojis['ac']} オートクリッカー`;
            document.getElementById('title-cpc').innerText = `${uiEmojis['cpc']} クリックパワー強化`;
            document.getElementById('title-cps').innerText = `${uiEmojis['cps']} 自動生産アセット`;
            document.getElementById('title-gacha-head').innerText = `${uiEmojis['gacha']} 拡張レア度ペットガチャ`;
            document.getElementById('title-inv').innerText = `${uiEmojis['inv']} ペットインベントリ`;

            // リバースボタンテキスト
            const luckBonus = game.reverses * 25;
            document.getElementById('reverse-count-display').innerText = `リバース回数: ${game.reverses} (幸運ブースト: +${luckBonus}%)`;

            game.upgrades.forEach(u => {
                const el = document.getElementById(`item-${u.id}`);
                if (el) {
                    if (game.coins >= u.cost) el.classList.remove('disabled');
                    else el.classList.add('disabled');
                    el.querySelector('.item-cost').innerText = `コスト: ${formatNumber(u.cost)} コイン`;
                    el.querySelector('.item-count').innerText = u.count;
                }
            });

            // 所持種類数のカウント
            const uniqueCount = Object.keys(game.ownedPets).length;
            document.getElementById('pet-total-counter').innerText = `(所持: ${uniqueCount} / 9種)`;
        }

        function createFloatingText(text, x, y) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            document.getElementById('left-panel').appendChild(el);
            setTimeout(() => el.remove(), 700);
        }

        function clickCoin(e) {
            const power = getCpc();
            game.coins += power;
            
            let x = window.innerWidth / 4;
            let y = window.innerHeight / 2;
            if (e && e.clientX) {
                x = e.clientX;
                y = e.clientY;
            } else {
                x += (Math.random() - 0.5) * 100;
                y += (Math.random() - 0.5) * 100;
            }
            createFloatingText(`+${formatNumber(power)}`, x, y);
            updateUI();
        }

        document.getElementById('coin-target').addEventListener('click', clickCoin);

        // スペースキー長押し自動連打システム
        let spaceInterval = null;
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!spaceInterval) {
                    clickCoin();
                    document.getElementById('coin-target').style.transform = 'scale(0.96)';
                    spaceInterval = setInterval(() => {
                        clickCoin();
                        document.getElementById('coin-target').style.transform = document.getElementById('coin-target').style.transform === 'scale(0.96)' ? 'scale(1)' : 'scale(0.96)';
                    }, 50);
                }
            }
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                if (spaceInterval) {
                    clearInterval(spaceInterval);
                    spaceInterval = null;
                    document.getElementById('coin-target').style.transform = 'none';
                }
            }
        });

        // オートクリッカー（毎秒100回の全自動ループ ＋ +1エフェクト完全連動）
        setInterval(() => {
            if (document.getElementById('autoclicker-toggle').checked) {
                clickCoin(null);
            }
        }, 10);

        // CPSループ (0.1秒単位で精緻に加算)
        setInterval(() => {
            const cps = getCps();
            if (cps > 0) {
                game.coins += cps / 10;
                updateUI();
            }
        }, 100);

        // 1秒ごとの完全自動セーブ処理
        setInterval(() => {
            saveGameLocalStorage();
        }, 1000);

        function buyUpgrade(id) {
            const u = game.upgrades.find(item => item.id === id);
            if (u && game.coins >= u.cost) {
                game.coins -= u.cost;
                u.count++;
                u.cost = Math.ceil(u.cost * 1.15);
                updateUI();
            }
        }

        function renderShop() {
            const cpcList = document.getElementById('cpc-list');
            const cpsList = document.getElementById('cps-list');
            cpcList.innerHTML = '';
            cpsList.innerHTML = '';

            game.upgrades.forEach(u => {
                const item = document.createElement('div');
                item.className = 'shop-item';
                item.id = `item-${u.id}`;
                item.onclick = () => buyUpgrade(u.id);

                item.innerHTML = `
                    <div class="item-icon">${uiEmojis[u.id]}</div>
                    <div class="item-info">
                        <div class="item-name">${u.name}</div>
                        <div class="item-cost">コスト: ${formatNumber(u.cost)} コイン</div>
                    </div>
                    <div class="item-count">${u.count}</div>
                `;

                if (u.type === 'cpc') cpcList.appendChild(item);
                else cpsList.appendChild(item);
            });
        }

        function switchTab(tab) {
            document.getElementById('tab-btn-shop').classList.remove('active');
            document.getElementById('tab-btn-gacha').classList.remove('active');
            document.getElementById('tab-shop').classList.remove('active');
            document.getElementById('tab-gacha').classList.remove('active');
            
            if (tab === 'shop') {
                document.getElementById('tab-btn-shop').classList.add('active');
                document.getElementById('tab-shop').classList.add('active');
            } else {
                document.getElementById('tab-btn-gacha').classList.add('active');
                document.getElementById('tab-gacha').classList.add('active');
            }
        }

        // コード適用システム
        function applyCode() {
            const codeInput = document.getElementById('secret-code');
            if (codeInput.value.trim() === 'cordelius') {
                game.coins += Math.pow(10, 39); // 1 Duodecillion
                alert('🎉 コード認証成功！ 1 Duodecillion コインをチャージしました！');
                codeInput.value = '';
                updateUI();
            } else {
                alert('❌ 無効な隠しコードです。');
            }
        }

        // リバース（再生）転生処理
        function triggerReverse() {
            if (game.coins >= 1000000) { // 最低1Mから転生可能
                if (confirm('🌀 リバース（再生）を行いますか？\n所持コインと施設はリセットされますが、リバース回数が増えて永続的にガチャ運が爆増します！')) {
                    game.reverses++;
                    game.coins = 0;
                    game.upgrades.forEach(u => {
                        u.count = 0;
                        const original = rawUpgrades.find(o => o.id === u.id);
                        u.cost = original.cost;
                    });
                    renderShop();
                    updateUI();
                    alert(`🌀 リバース完了！リバース回数: ${game.reverses}回目。ガチャ確率がさらに高まりました！`);
                }
            } else {
                alert('❌ リバースするには最低 1.00M (100万) コイン必要です！');
            }
        }

        // ガチャ確率抽選アルゴリズム (転生回数に応じて最高レアが超爆増)
        function rollGacha(times) {
            const cost = 500 * times;
            if (game.coins < cost) {
                document.getElementById('gacha-result').innerText = '❌ コインが足りません！';
                return;
            }
            game.coins -= cost;

            // リバース回数に応じた幸運補正倍率
            const luckFactor = 1 + (game.reverses * 0.25);
            let results = [];

            for (let t = 0; t < times; t++) {
                const r = Math.random();
                let pet;

                // 基礎確率テーブル（通常時でも超高確率アッパー調整済み）
                // OG, Eternal, Secret, Exotic, Mythic などの割合を大幅拡張
                if (r < 0.20 / luckFactor) pet = petPool[Math.floor(Math.random() * 2)]; // Common
                else if (r < 0.45 / luckFactor) pet = petPool[2 + Math.floor(Math.random() * 2)]; // Rare
                else if (r < 0.65 / luckFactor) pet = petPool[4 + Math.floor(Math.random() * 2)]; // Epic
                else if (r < 0.80 / luckFactor) pet = petPool[6 + Math.floor(Math.random() * 2)]; // Legendary
                else if (r < 0.88 / luckFactor) pet = petPool[8]; // Mythic
                else if (r < 0.94 / luckFactor) pet = petPool[9]; // Exotic
                else if (r < 0.97 / luckFactor) pet = petPool[10]; // Secret
                else if (r < 0.99 / luckFactor) pet = petPool[11]; // Eternal
                else pet = petPool[12]; // OG (最高レア)

                // 獲得加算
                game.ownedPets[pet.id] = (game.ownedPets[pet.id] || 0) + 1;
                results.push(`<span class="${pet.rarityClass}">[${pet.rarity}] ${pet.name}</span>`);
            }

            if (times === 1) {
                document.getElementById('gacha-result').innerHTML = `🎉 獲得: ${results[0]}`;
            } else {
                document.getElementById('gacha-result').innerHTML = `🎁 10連結果:<br>${results.join('<br>')}`;
            }

            renderInventory();
            updateUI();
        }

        function togglePet(id) {
            if (game.equippedPet === id) {
                game.equippedPet = null;
            } else {
                game.equippedPet = id;
            }
            renderInventory();
            updateUI();
        }

        function renderInventory() {
            const container = document.getElementById('inventory-container');
            container.innerHTML = '';
            
            petPool.forEach(pet => {
                const count = game.ownedPets[pet.id] || 0;
                if (count > 0) {
                    const card = document.createElement('div');
                    card.className = `pet-card ${game.equippedPet === pet.id ? 'equipped' : ''}`;
                    card.onclick = () => togglePet(pet.id);
                    
                    let desc = pet.bonusType === 'all' ? `x${pet.value}` : `+${pet.value}`;
                    card.innerHTML = `
                        <div class="pet-badge">E</div>
                        <div class="pet-qty">×${count}</div>
                        <div class="pet-card-icon">${uiEmojis[pet.id]}</div>
                        <div class="pet-card-name">${pet.name}</div>
                        <div class="pet-card-rarity ${pet.rarityClass}">${pet.rarity}</div>
                        <div class="pet-card-bonus">${pet.bonusType.toUpperCase()} ${desc}</div>
                    `;
                    container.appendChild(card);
                }
            });
        }

        // ゴールデンクッキー（ランダム発生）
        function spawnGoldenCookie() {
            const gc = document.getElementById('gcookie');
            gc.innerText = uiEmojis['g_cookie'];
            gc.style.display = 'block';
            gc.style.left = `${Math.random() * 60 + 20}%`;
            gc.style.top = `${Math.random() * 60 + 20}%`;

            gc.onclick = () => {
                gc.style.display = 'none';
                buffMultiplier = 5;
                buffTimer = 15;
                document.getElementById('buff-display').style.display = 'block';
            };

            setTimeout(() => { gc.style.display = 'none'; }, 8000);
        }
        setInterval(() => { if (Math.random() < 0.2) spawnGoldenCookie(); }, 20000);

        setInterval(() => {
            if (buffTimer > 0) {
                buffTimer--;
                document.getElementById('buff-time').innerText = buffTimer;
                if (buffTimer === 0) {
                    buffMultiplier = 1;
                    document.getElementById('buff-display').style.display = 'none';
                }
            }
        }, 1000);

        // オートセーブストレージ入出力
        function saveGameLocalStorage() {
            const saveData = {
                coins: game.coins,
                reverses: game.reverses,
                equippedPet: game.equippedPet,
                ownedPets: game.ownedPets,
                counts: game.upgrades.map(u => ({ id: u.id, count: u.count, cost: u.cost }))
            };
            localStorage.setItem('coin_clicker_autosave_v3', JSON.stringify(saveData));
        }

        function loadGameOnLaunch() {
            const raw = localStorage.getItem('coin_clicker_autosave_v3');
            if (raw) {
                try {
                    const data = JSON.parse(raw);
                    game.coins = data.coins || 0;
                    game.reverses = data.reverses || 0;
                    game.equippedPet = data.equippedPet || null;
                    game.ownedPets = data.ownedPets || {};
                    
                    if (data.counts) {
                        data.counts.forEach(saved => {
                            const u = game.upgrades.find(item => item.id === saved.id);
                            if (u) {
                                u.count = saved.count;
                                u.cost = saved.cost;
                            }
                        });
                    }
                } catch (e) {
                    console.error("セーブデータの復元に失敗しました", e);
                }
            }
        }

        initGame();
    </script>
</body>
</html>
